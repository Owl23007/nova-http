name: Benchmark archive

on:
  workflow_run:
    workflows: [Benchmark]
    types: [completed]
    branches: [master]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: benchmark-archive-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  archive:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Verify and promote JSON
        id: promote
        run: node packages/benchmarks/report/archive-cli.js promote
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create archive pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.promote.outputs.branch }}
          ARCHIVE_PATH: ${{ steps.promote.outputs.archive-path }}
          ARTIFACT_ID: ${{ steps.promote.outputs.artifact-id }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -- "$ARCHIVE_PATH"
          git commit -m 'chore(benchmark): 归档经来源验证的基准数据'
          gh auth setup-git
          git push origin "$BRANCH"
          printf '追加正式基准 JSON\n\nArtifact ID: %s\n\n需通过来源、内容一致性和只追加校验后合并\n' "$ARTIFACT_ID" > "$RUNNER_TEMP/benchmark-pr.md"
          gh pr create --base master --head "$BRANCH" --title 'chore(benchmark): 归档正式基准数据' --body-file "$RUNNER_TEMP/benchmark-pr.md"
