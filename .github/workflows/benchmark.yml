name: Benchmark checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - packages/nova-http/**
      - packages/benchmarks/**
      - pnpm-lock.yaml
      - .github/workflows/benchmark.yml

permissions:
  contents: read

jobs:
  changes:
    name: Select benchmark checks
    runs-on: ubuntu-24.04
    outputs:
      measure: ${{ steps.paths.outputs.measure }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [ "$EVENT" = push ]; then
            echo 'measure=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -Eq '^(packages/(nova-http|benchmarks)/|pnpm-lock.yaml$|.github/workflows/benchmark.yml$)'; then
            echo 'measure=true' >> "$GITHUB_OUTPUT"
          else
            echo 'measure=false' >> "$GITHUB_OUTPUT"
          fi

  measure:
    name: ${{ github.event_name == 'pull_request' && 'PR paired comparison' || 'Master smoke' }}
    needs: changes
    if: needs.changes.outputs.measure == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: benchmark-check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Checkout PR baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .tmp/benchmark/work/baseline
          persist-credentials: false
      - name: Install PR baseline
        if: github.event_name == 'pull_request'
        working-directory: .tmp/benchmark/work/baseline
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run PR comparison
        if: github.event_name == 'pull_request'
        id: compare
        env:
          BENCH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BENCH_PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if git diff --name-only "$BASE" HEAD -- packages/benchmarks .github/workflows/benchmark.yml | grep -q .; then
            export BENCH_METHODOLOGY_CHANGED=true
          fi
          pnpm --filter @nova-http/benchmarks bench --profile pr --load pipeline-10 --scenario json-small --baseline-root "$GITHUB_WORKSPACE/.tmp/benchmark/work/baseline"
      - name: Run master smoke
        if: github.event_name == 'push'
        id: smoke
        run: pnpm --filter @nova-http/benchmarks bench --profile smoke --load pipeline-1 --scenario json-small
      - name: Upload diagnostic records
        if: always() && (steps.compare.outputs.results != '' || steps.smoke.outputs.results != '')
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.compare.outputs.results || steps.smoke.outputs.results }}/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
